<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klef Tool Set - Home</title>
    <script src="../../shared/utilities/kit-manager/kit-manager.js"></script>
    <script src="../../shared/utilities/ui-composer/ui-composer.js"></script>
    <script src="../../shared/utilities/icon-loader/iconloader.js"></script>
    <!-- script>constructIcons('/assets/icons/menu-icons-svg.html')</script-->

    <!-- ========
     /* styles */
    ======== -->
    <link rel="stylesheet" href="../../assets/styles/design-system.css">
    <link rel="stylesheet" href="../../assets/styles/css-short.css">
    <link rel="stylesheet" href="../../shared/components/bottom-sheet/bottom-sheet.css">
    <style>
        :root {
            --bg: #ffffff;
            --panel: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --accent: #007aff;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, Inter, system-ui;
            background: var(--bg);
            color: var(--text);
        }

        .header-nav {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: var(--accent);
            border: none;
            color: #000;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border-color: var(--gray-300);
        }

        .card svg {
            width: 32px;
            height: 32px;
        }

        .card span {
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .header-nav {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 12px 16px;
            }

            .grid {
                padding: 12px;
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 12px;
            }

            .card {
                padding: 8px;
            }

            .card svg {
                width: 28px;
                height: 28px;
            }

            .card span {
                font-size: 12px;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }

        label {
            font-size: 12px;
            color: var(--muted);
        }

        input:not([type="color"]),
        textarea,
        select {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 10px;
        }

        input[type="color"] {
            display: flex;
            border: none;
            width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background: transparent;
            height: 50px;
        }

        /* Estilo para Chrome/Safari/Edge */
        .custom-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .custom-picker::-webkit-color-swatch {
            border: 2px solid #3d3d3d;
            border-radius: 8px;
            /* Bordes redondeados modernos */
        }

        /* Estilo para Firefox */
        .custom-picker::-moz-color-swatch {
            border: 2px solid #3d3d3d;
            border-radius: 8px;
        }

        textarea {
            min-height: 120px;
            font-family: monospace;
            white-space: break-spaces;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .preview {
            background: var(--panel);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview svg {
            width: 40px;
            height: 40px;
        }

        .hidden {
            display: none;
        }

        .header-nav button,
        .sheet button {
            color: #ffffff;
        }

        .header-nav button:hover,
        .sheet button:hover {
            color: var(--accent);
            background-color: var(--soft-blue);
        }
    </style>
</head>

<body>
    <header class="cssapp-header">
        <!-- -->
    </header>
    <div class="header-nav">
        <h2>SVG Symbols</h2>
        <div style="
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          align-items: flex-start;
        ">
            <div style="display: flex; flex-direction: column; gap: 4px">
                <label style="font-size: 12px; color: var(--muted)">Kit Selection</label>
                <div style="display: flex; gap: 4px; align-items: center">
                    <select id="kitSelect"></select>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
                <label style="font-size: 12px; color: var(--muted)">Cache</label>
                <div style="display: flex; gap: 4px; align-items: center">
                    <button id="flushCache">Flush Cache</button>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
                <label style="font-size: 12px; color: var(--muted)">Kit Import/Export</label>
                <div style="display: flex; gap: 4px; align-items: center">
                    <button id="downloadKit">Descargar JSON</button>
                    <input type="file" id="uploadKit" accept=".json" style="display: none" />
                    <button id="uploadBtn">Subir JSON</button>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
                <label style="font-size: 12px; color: var(--muted)">Symbol Management</label>
                <div style="display: flex; gap: 4px; align-items: center">
                    <button id="viewSet">Ver Set</button>
                    <button id="new">+ Nuevo Symbol</button>
                </div>
            </div>
        </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="adaptive-backdrop" id="backdrop"></div>
    <div class="adaptive-sheet" id="sheet">
        <div class="sheet-header" id="header">
            <div class="sheet-drag-handle"></div>
            <div class="sheet-title-bar">
                <h2 class="sheet-title" id="sheetTitle">Nuevo Symbol</h2>
                <button class="sheet-close-btn" id="closeBtn">×</button>
            </div>
        </div>
        <div class="sheet-content" id="content">
            <label>Nombre</label>
            <input id="name" placeholder="Home" />
            <label>SVG (paths / groups, sin &#x3C;svg&#x3E;)</label>
            <textarea id="svg" class="code bg-code"></textarea>
            <div class="controls">
                <div>
                    <label>Fill</label>
                    <select id="fillMode">
                        <option value="none">None</option>
                        <option value="currentColor">currentColor</option>
                        <option value="color">Color</option>
                    </select>
                    <input type="color" id="fill" value="#ffffff" class="custom-picker" />
                </div>
                <div>
                    <label>Stroke</label>
                    <select id="strokeMode">
                        <option value="currentColor">currentColor</option>
                        <option value="color">Color</option>
                        <option value="none">None</option>
                    </select>
                    <input type="color" id="stroke" value="#000000" class="custom-picker" />
                </div>
            </div>
            <label>Stroke width</label>
            <input type="range" min="0" max="4" step="0.5" id="strokeWidth" value="1.5" />
            <div class="preview" id="preview"></div>
            <label>Sprite SVG</label>
            <textarea id="spriteCode" readonly></textarea>
        </div>
        <div class="sheet-cta">
            <button id="save" class="btn btn-primary" style="--w-fill:1;">Guardar</button>
        </div>
    </div>
    <svg id="sprite" class="hidden" xmlns="http://www.w3.org/2000/svg"></svg>
    <script src="../../shared/components/bottom-sheet/bottom-sheet.js"></script>
    <script>
        const SVG_NS = "http://www.w3.org/2000/svg";
        const kitManager = new KitManager();
        let currentKit = "default";
        let symbols = kitManager.getKit(currentKit);
        let activeIndex = null;
        const grid = document.getElementById("grid");
        const sheetElement = document.getElementById("sheet");
        const backdrop = document.getElementById("backdrop");
        const kitSelect = document.getElementById("kitSelect");

        // Inicializar el componente bottom-sheet
        const adaptiveSheet = new AdaptiveSheet({
            sheetId: "sheet",
            backdropId: "backdrop",
            headerId: "header",
            closeBtnId: "closeBtn",
            contentId: "content",
            swipeThreshold: 100,
            onOpen: () => console.log("🎉 Sheet abierto"),
            onClose: () => console.log("👋 Sheet cerrado"),
            onStateChange: (state) => console.log(`🔄 Estado cambiado a: ${state}`),
        });

        // Kit management functions
        function updateKitSelect() {
            kitSelect.innerHTML = "";
            const kits = kitManager.listKits();
            if (kits.length === 0) kits.push("default");
            kits.forEach((kit) => {
                const option = document.createElement("option");
                option.value = kit;
                option.textContent = kit;
                if (kit === currentKit) option.selected = true;
                kitSelect.appendChild(option);
            });
        }

        function loadKit(kitName) {
            currentKit = kitName;
            symbols = kitManager.getKit(kitName);
            document.getElementById("sprite").innerHTML = "";
            symbols.forEach((s) => {
                const symbol = document.createElementNS(SVG_NS, "symbol");
                symbol.setAttribute("id", s.id);
                symbol.setAttribute("viewBox", "0 0 24 24");
                const parsed = safeParseSVG(s.raw);
                [...parsed.children].forEach((n) =>
                    symbol.appendChild(n.cloneNode(true))
                );
                document.getElementById("sprite").appendChild(symbol);
            });
            renderGrid();
        }

        function saveCurrentKit() {
            kitManager.saveKit(currentKit, symbols);
        }

        // Load external kits from data/svg-kits/
        // Load external kits automatically from index.json
        async function loadExternalKits() {
            try {
                const res = await fetch("../../data/svg-kits/index.json");
                if (!res.ok) throw new Error("No se pudo cargar index.json");

                const index = await res.json();

                // Construir objeto esperado por KitManager
                const kits = {};
                Object.entries(index).forEach(([kitName, fileName]) => {
                    kits[kitName] = `../../data/svg-kits/${fileName}`;
                });

                await kitManager.loadKitsFromURLs(kits);

                updateKitSelect();

                // Cargar el primer kit disponible
                const availableKits = kitManager.listKits();
                if (availableKits.length > 0) {
                    currentKit = availableKits[0];
                    loadKit(currentKit);
                }
            } catch (err) {
                console.error("Error cargando kits externos:", err);
            }
        }


        // Initialize
        loadExternalKits().then(() => {
            updateKitSelect();
            loadKit(currentKit);
        });

        function openSheet() {
            adaptiveSheet.open();
        }
        function closeSheet() {
            adaptiveSheet.close();
        }

        // Kit event listeners
        kitSelect.onchange = () => {
            saveCurrentKit();
            loadKit(kitSelect.value);
        };

        document.getElementById("downloadKit").onclick = () => {
            kitManager.downloadKit(currentKit);
        };

        document.getElementById("uploadBtn").onclick = () => {
            document.getElementById("uploadKit").click();
        };

        document.getElementById("uploadKit").onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                kitManager.loadKitFromFile(file, (json) => {
                    const kitName = prompt(
                        "Nombre para el kit importado:",
                        file.name.replace(".json", "")
                    );
                    if (kitName && kitManager.importKit(kitName, json)) {
                        updateKitSelect();
                        loadKit(kitName);
                    }
                });
            }
        };

        document.getElementById("flushCache").onclick = () => {
            localStorage.clear();
            location.reload();
        };

        document.getElementById("new").onclick = () => {
            activeIndex = null;
            document.getElementById("sheetTitle").textContent = "Nuevo Symbol";
            document.getElementById("name").value = "";
            document.getElementById("svg").value = "";
            document.getElementById("preview").innerHTML = "";
            openSheet();
        };

        document.getElementById("viewSet").onclick = () => {
            document.getElementById("sheetTitle").textContent = "Sprite completo";
            document.getElementById("spriteCode").value =
                document.getElementById("sprite").outerHTML;
            openSheet();
        };

        function openEdit(index) {
            activeIndex = index;
            const s = symbols[index];
            document.getElementById("sheetTitle").textContent = "Editar Symbol";
            document.getElementById("name").value = s.name;
            document.getElementById("svg").value = s.raw;
            updatePreview();
            openSheet();
        }

        function safeParseSVG(content) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(
                `<svg xmlns="${SVG_NS}">${content}</svg>`,
                "image/svg+xml"
            );
            return doc.documentElement;
        }

        function updatePreview() {
            const raw = document.getElementById("svg").value;
            if (!raw) return;
            const wrapper = safeParseSVG(raw);
            wrapper.setAttribute("viewBox", "0 0 24 24");
            const target = wrapper.querySelector("*");
            if (target) {
                const fm = fillMode.value,
                    sm = strokeMode.value;
                if (fm === "color") target.setAttribute("fill", fill.value);
                if (fm === "currentColor")
                    target.setAttribute("fill", "currentColor");
                if (fm === "none") target.setAttribute("fill", "none");
                if (sm === "color") target.setAttribute("stroke", stroke.value);
                if (sm === "currentColor")
                    target.setAttribute("stroke", "currentColor");
                if (sm === "none") target.setAttribute("stroke", "none");
                target.setAttribute("stroke-width", strokeWidth.value);
                //console.log(strokeWidth);
            }
            preview.innerHTML = "";
            preview.appendChild(wrapper);
        }
        [
            "svg",
            "fill",
            "stroke",
            "strokeWidth",
            "fillMode",
            "strokeMode",
        ].forEach((id) => (document.getElementById(id).oninput = updatePreview));

        function renderGrid() {
            grid.innerHTML = "";
            symbols.forEach((s, i) => {
                const c = document.createElement("div");
                c.className = "card";
                const svg = document.createElementNS(SVG_NS, "svg");
                const use = document.createElementNS(SVG_NS, "use");
                use.setAttribute("href", `#${s.id}`);
                svg.appendChild(use);
                const span = document.createElement("span");
                span.textContent = s.name;
                c.append(svg, span);
                c.onclick = () => openEdit(i);
                grid.appendChild(c);
            });
        }

        save.onclick = () => {
            const name = document.getElementById("name").value.trim();
            if (!name) return;
            const raw = document.getElementById("svg").value;
            const id = "icon-" + name.toLowerCase().replace(/\s+/g, "-");
            const symbol = document.createElementNS(SVG_NS, "symbol");
            symbol.setAttribute("id", id);
            symbol.setAttribute("viewBox", "0 0 24 24");
            const parsed = safeParseSVG(raw);
            [...parsed.children].forEach((n) =>
                symbol.appendChild(n.cloneNode(true))
            );
            if (activeIndex !== null) {
                const old = symbols[activeIndex];
                document.getElementById(old.id)?.remove();
                symbols[activeIndex] = { id, name, raw };
            } else {
                symbols.push({ id, name, raw });
            }
            document.getElementById("sprite").appendChild(symbol);
            document.getElementById("spriteCode").value =
                document.getElementById("sprite").outerHTML;
            renderGrid();
            saveCurrentKit(); // Persist changes
            closeSheet();
        };
    </script>
</body>

</html>

    <style>
        /* Reset y Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: #22323a;
            background: #ffffff;
            line-height: 1.6;
        }

        /* Hero Container */
        .hero-container {
            height: 800px;
            position: relative;
            overflow: hidden;
        }

        .masonry-block {
            display: flex;
            width: 100%;
            flex-wrap: wrap;
            position: absolute;
            height: 700px;
            align-items: center;
            top: 0;
        }

        [class*="half-"] {
            width: 50%;
            height: 100%;
        }

        .half-left {
            display: flex;
            align-items: center;
            padding: 2rem 3rem;
            position: relative;
            z-index: 10;
        }

        .half-right {
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .hero-content h2,
        .hero-content h2+p {
            margin-left: 10px;
        }

        /* Hero Content */
        .hero-content {
            max-width: 540px;
        }

        .hero_title {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .hero_text {
            color: #6b7280;
            font-size: 1.25rem;
            line-height: 1.75rem;
            margin: 1.5rem 0 2rem 0;
            margin-top: 0rem;
        }

        /* Text Animation */
        .word {
            position: absolute;
            opacity: 0;
        }

        .letter {
            display: inline-block;
            position: relative;

            transform: translateZ(25px);
            transform-origin: 50% 50% 25px;
        }

        .letter.out {
            transform: rotateX(90deg);
            transition: transform 0.32s cubic-bezier(0.55, 0.055, 0.675, 0.19);
        }

        .letter.behind {
            transform: rotateX(-90deg);
        }

        .letter.in {
            transform: rotateX(0deg);
            transition: transform 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Colors */
        .purple {
            color: #8e44ad;
        }

        .azul {
            color: #2980b9;
        }

        .green {
            color: #16a085;
        }

        .oxido {
            color: #db4b10;
        }

        /* Images Masonry */
        .images_container {
            display: grid;
            row-gap: 32px;
            align-content: center;
        }

        .img_container {
            width: 13vw;
            height: auto;
            min-width: 150px;
        }

        .images_container img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .images_container img:hover {
            transform: scale(1.05);
        }

        .images_container:nth-child(2) {
            transform: translateY(0rem);
        }

        .images_container:not(:first-child) {
            margin-left: 32px;
        }

        /* Search Box */
        .white-shadow {
            background: #f5f6f7ba;
            padding: 2rem;
            border-radius: 18px;
            box-shadow: 0px 6px 54px 7px rgb(214 214 214);
            border: inset 1px #cccccc44;
        }

        .search-container {
            position: relative;
            background: white;
            border: 1px solid #e5e7ea;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
        }

        .search-container .icon {
            margin-right: 0.75rem;
        }

        .search-container svg {
            width: 1.25rem;
            height: 1.25rem;
            color: #8e8e93;
        }

        .is-search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
        }

        .is-search-input::placeholder {
            color: #b0b5ba;
        }

        .filter-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        #filterCheckbox {
            display: none;
        }

        .filter-module {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7ea;
        }

        #filterCheckbox:checked~.filter-module {
            display: block;
        }

        /* Tags */
        #search-tags {
            display: flex;
            gap: 0.3rem;
            margin-left: 0.3rem;
            flex-wrap: wrap;
        }

        #search-tags>span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            border: 1px solid;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        #search-tags>span:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #search-tags>span svg {
            margin-right: 0.5rem;
            width: 1rem;
            height: 1rem;
        }

        .border-emerald-500 {
            border-color: #16a085;
            color: #16a085;
        }

        .border-amber-500 {
            border-color: #e68600;
            color: #e68600;
        }

        .border-blue-500 {
            border-color: #2980b9;
            color: #2980b9;
        }

        /* Search */

        .input {
            height: 2.75rem;
            padding: 0 1rem;
            font-size: 1rem;
            border: 1px solid #d2d2d7;
            border-radius: 0.75rem;
            background: white;
            color: #1d1d1f;

        .input-with-icon {

            line-height: 1;

            }

            }
        }

        @media screen and (max-width: 768px) {


            .masonry-block {
                flex-direction: column-reverse;
                height: auto;
                position: relative;
            }

            [class*="half-"] {

                gap: 0px;
            }

            .half-left {

            }

            .half-right {

            }

            }

                font-size: 2rem;
            }

            .white-shadow {
                padding: 2rem 1rem;
            }

    </style>

        }

    <script>
        var words = document.getElementsByClassName('word');
        var wordArray = [];
        var currentWord = 0;

        words[currentWord].style.opacity = 1;

        for (var i = 0; i < words.length; i++) {
            splitLetters(words[i]);
        }

        function changeWord() {
            var cw = wordArray[currentWord];
            var nw = currentWord == words.length - 1 ? wordArray[0] : wordArray[currentWord + 1];

            for (var i = 0; i < cw.length; i++) {
                animateLetterOut(cw, i);
            }

            for (var i = 0; i < nw.length; i++) {
                nw[i].className = 'letter behind';
                nw[0].parentElement.style.opacity = 1;
                animateLetterIn(nw, i);
            }

            currentWord = (currentWord == wordArray.length - 1) ? 0 : currentWord + 1;
        }

        function animateLetterOut(cw, i) {
            setTimeout(function () {
                cw[i].className = 'letter out';
            }, i * 80);
        }

        function animateLetterIn(nw, i) {
            setTimeout(function () {
                nw[i].className = 'letter in';
            }, 340 + (i * 80));
        }

        function splitLetters(word) {
            var content = word.innerHTML;
            word.innerHTML = '';
            var letters = [];

            for (var i = 0; i < content.length; i++) {
                var letter = document.createElement('span');
                letter.className = 'letter';

                if (content.charAt(i) === '¨') {
                    letter.innerHTML = '&nbsp;';
                    letter.style.opacity = '0';
                } else {
                    letter.innerHTML = content.charAt(i);
                }

                word.appendChild(letter);
                letters.push(letter);
            }

            wordArray.push(letters);
        }

        changeWord();
        setInterval(changeWord, 4000);

        // Search input focus
        document.querySelector('.search-container').addEventListener('click', function (event) {
            const isFilterButton = event.target.closest('.filter-toggle');
            if (!isFilterButton) {
                document.getElementById('is-search-input-10380').focus();
            }
        });
    </script>
